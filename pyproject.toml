# © VampSecure Studios — VampSecure Labs Security Research Division
[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "vamp-aws-audit"
version         = "1.0.0"
description     = "Auditor CIS AWS Level 1 — 71 controles IAM/S3/EC2/CloudTrail/RDS/KMS/GuardDuty/Config"
readme          = "README.md"
license         = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"
authors         = [{ name = "VampSecure Studios", email = "belky@protonmail.ch" }]
keywords        = ["aws", "cis", "security", "audit", "cloud", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
vamp-aws-audit = "vamp_aws_audit:main_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["vamp_aws_audit*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers      = ["integration: requiere credenciales AWS reales"]
